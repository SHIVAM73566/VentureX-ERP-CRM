  <text x="400" y="96" text-anchor="middle" fill="#8b949e" font-size="11">Terminal — Open in the venturex-erp folder</text>
  <text x="60" y="130" fill="#7ee787" font-size="13" font-family="monospace">C:\Projects&gt; <tspan fill="#c9d1d9">cd venturex-erp</tspan></text>
  <text x="60" y="155" fill="#7ee787" font-size="13" font-family="monospace">C:\Projects\venturex-erp&gt; <tspan fill="#c9d1d9">composer install</tspan></text>
