  <text x="400" y="24" text-anchor="middle" fill="#93c5fd" font-size="12">VentureX ERP & CRM — Installation Guide</text>
  <text x="400" y="46" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">Step 2: Install PHP Packages (Composer)</text>
