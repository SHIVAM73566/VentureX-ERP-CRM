  <text x="60" y="230" fill="#c9d1d9" font-size="12" font-family="monospace">  - Installing <tspan fill="#79c0ff">laravel/framework</tspan> (v11.x.x)</text>
  <text x="60" y="250" fill="#c9d1d9" font-size="12" font-family="monospace">  - Installing <tspan fill="#79c0ff">laravel/sanctum</tspan> (v4.x.x)</text>
  <text x="60" y="270" fill="#c9d1d9" font-size="12" font-family="monospace">  - Installing <tspan fill="#79c0ff">spatie/laravel-permission</tspan> (v6.x.x)</text>
  <text x="60" y="290" fill="#c9d1d9" font-size="12" font-family="monospace">  - Installing <tspan fill="#79c0ff">barryvdh/laravel-dompdf</tspan> (v2.x.x)</text>
  <text x="60" y="310" fill="#8b949e" font-size="12" font-family="monospace">  ... (112 packages total)</text>
