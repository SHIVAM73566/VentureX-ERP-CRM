name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-24.04

    env:
      DB_CONNECTION: sqlite
      DB_DATABASE: ":memory:"
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      APP_ENV: testing
      APP_DEBUG: "true"

    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          ini-values: memory_limit=1G, max_execution_time=0
          extensions: mbstring, xml, bcmath, pdo_sqlite, sqlite3, gd, fileinfo, intl, zip, curl, dom, simplexml

      - name: Setup Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Validate composer.json
        run: composer validate --no-check-all --no-check-publish

      - name: Get Composer cache dir
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install PHP dependencies
        run: composer install --no-progress --no-interaction --prefer-dist

      - name: Get npm cache dir
        id: npm-cache
        run: echo "dir=$(npm config get cache)" >> $GITHUB_OUTPUT

      - name: Cache npm dependencies
        uses: actions/cache@v5
        with:
          path: ${{ steps.npm-cache.outputs.dir }}
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-npm-

      - name: Install Node dependencies & build
        run: npm ci && npm run build

      - name: Setup environment
        run: |
          cp .env.example .env
          mkdir -p storage/logs storage/framework/cache storage/framework/sessions storage/framework/views
          touch storage/.installed

      - name: Generate application key
        run: php artisan key:generate --force

      - name: Run test suite
        run: |
          set -o pipefail
          php -d memory_limit=1G -d max_execution_time=0 vendor/bin/phpunit --no-coverage --colors=never --log-junit /tmp/junit.xml 2>&1 | tee /tmp/phpunit.log

      - name: Capture Laravel log on failure
        if: failure()
        run: |
          echo "::group::Laravel log (tail 200)"
          if [ -f storage/logs/laravel.log ]; then tail -200 storage/logs/laravel.log; else echo "No storage/logs/laravel.log"; fi
          echo "::endgroup::"

      - name: Annotate failing tests
        if: failure()
        run: php .github/annotate-failures.php