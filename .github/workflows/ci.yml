name: CI — Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, bcmath, pdo_mysql, sqlite3, gd, fileinfo

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install PHP dependencies
        run: composer install --no-progress --no-interaction

      - name: Install Node dependencies & build
        run: npm ci && npm run build

      - name: Setup environment
        run: |
          cp .env.example .env
          sed -i 's/DB_CONNECTION=mysql/DB_CONNECTION=sqlite/' .env
          sed -i 's/DB_HOST=127.0.0.1/# DB_HOST=127.0.0.1/' .env
          sed -i 's/DB_PORT=3306/# DB_PORT=3306/' .env
          sed -i 's/DB_DATABASE=VENTUREX_ERP/DB_DATABASE=database\/database.sqlite/' .env
          sed -i 's/DB_USERNAME=VENTUREX_ERP_user/# DB_USERNAME=VENTUREX_ERP_user/' .env
          sed -i 's/DB_PASSWORD=your_database_password/# DB_PASSWORD=/' .env
          php artisan key:generate
          touch database/database.sqlite

      - name: Run migrations
        run: php artisan migrate --force

      - name: Run test suite
        run: vendor/bin/phpunit
