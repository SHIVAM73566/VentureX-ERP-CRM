name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      DB_CONNECTION: sqlite
      DB_DATABASE: ":memory:"
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      APP_ENV: testing
      APP_DEBUG: "true"

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, bcmath, pdo_sqlite, sqlite3, gd, fileinfo, intl, zip, curl

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Validate composer.json
        run: composer validate --no-check-all --no-check-publish

      - name: Get Composer cache dir
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install PHP dependencies
        run: composer install --no-progress --no-interaction --prefer-dist

      - name: Get npm cache dir
        id: npm-cache
        run: echo "dir=$(npm config get cache)" >> $GITHUB_OUTPUT

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.npm-cache.outputs.dir }}
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-npm-

      - name: Install Node dependencies & build
        run: npm ci && npm run build

      - name: Setup environment
        run: |
          cp .env.example .env
          mkdir -p storage/logs storage/framework/cache storage/framework/sessions storage/framework/views
          touch storage/.installed

      - name: Generate application key
        run: php artisan key:generate --force

      - name: Run test suite
        run: |
          set -o pipefail
          vendor/bin/phpunit --no-coverage --colors=never --log-junit /tmp/junit.xml 2>&1 | tee /tmp/phpunit.log

      - name: Capture Laravel log on failure
        if: failure()
        run: |
          echo "::group::Laravel log (tail 200)"
          if [ -f storage/logs/laravel.log ]; then tail -200 storage/logs/laravel.log; else echo "No storage/logs/laravel.log"; fi
          echo "::endgroup::"

      - name: Annotate failing tests
        if: failure()
        run: |
          php -r '
            $file = "/tmp/junit.xml";
            if (!is_file($file)) { fwrite(STDERR, "No JUnit XML found\n"); exit(0); }
            $xml = new SimpleXMLElement(file_get_contents($file));
            $count = 0;
            foreach ($xml->testsuite as $suite) {
              foreach ($suite->testcase as $tc) {
                $fail = null;
                foreach (["failure", "error"] as $tag) {
                  if (isset($tc->$tag)) { $fail = $tc->$tag; break; }
                }
                if ($fail === null) { continue; }
                $src = isset($tc->attributes()["file"]) ? (string) $tc->attributes()["file"] : "tests";
                $line = isset($tc->attributes()["line"]) ? (string) $tc->attributes()["line"] : "1";
                $name = isset($tc->attributes()["name"]) ? (string) $tc->attributes()["name"] : "test";
                $msg = trim(preg_replace("/\s+/", " ", (string) $fail));
                $short = mb_substr($msg, 0, 900);
                echo "::error file={$src},line={$line}::{$name}: {$short}\n";
                $count++;
              }
            }
            echo "Annotated {$count} failing test(s)\n";
          '