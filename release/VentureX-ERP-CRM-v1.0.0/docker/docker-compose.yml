version: '3.8'

services:
  # PHP-FPM Application Service
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: venturex-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - venturex-network
    depends_on:
      - mysql
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G

  # Nginx Web Server
  nginx:
    image: nginx:alpine
    container_name: venturex-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./docker/nginx/ssl:/etc/nginx/ssl
    networks:
      - venturex-network
    depends_on:
      - app
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M

  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: venturex-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-venturex}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_USER: ${DB_USERNAME:-venturex}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
    networks:
      - venturex-network
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
    command: --default-authentication-plugin=mysql_native_password

  # Redis Cache (Optional)
  redis:
    image: redis:7-alpine
    container_name: venturex-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - venturex-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # Queue Worker (Optional)
  queue-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: venturex-queue-worker
    restart: unless-stopped
    working_dir: /var/www
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    volumes:
      - .:/var/www
    networks:
      - venturex-network
    depends_on:
      - app
      - mysql
      - redis

volumes:
  mysql-data:
    driver: local
  redis-data:
    driver: local

networks:
  venturex-network:
    driver: bridge
