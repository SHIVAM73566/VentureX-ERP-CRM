  <text x="532" y="445" text-anchor="middle" fill="#60a5fa" font-family="Arial" font-size="10">invoices</text>
  <rect x="575" y="430" width="70" height="22" fill="#172554" rx="11"/>
  <text x="610" y="445" text-anchor="middle" fill="#60a5fa" font-family="Arial" font-size="10">payments</text>
  <rect x="655" y="430" width="65" height="22" fill="#172554" rx="11"/>
  <text x="687" y="445" text-anchor="middle" fill="#60a5fa" font-family="Arial" font-size="10">tickets</text>
  <rect x="50" y="458" width="70" height="22" fill="#172554" rx="11"/>
  <text x="85" y="473" text-anchor="middle" fill="#60a5fa" font-family="Arial" font-size="10">accounts</text>
  <rect x="130" y="458" width="80" height="22" fill="#172554" rx="11"/>
  <text x="170" y="473" text-anchor="middle" fill="#60a5fa" font-family="Arial" font-size="10">warehouses</text>
  <rect x="220" y="458" width="90" height="22" fill="#172554" rx="11"/>
  <text x="265" y="473" text-anchor="middle" fill="#60a5fa" font-family="Arial" font-size="10">purchase_orders</text>
  <rect x="320" y="458" width="70" height="22" fill="#172554" rx="11"/>
  <text x="355" y="473" text-anchor="middle" fill="#60a5fa" font-family="Arial" font-size="10">shipments</text>
  <rect x="400" y="458" width="80" height="22" fill="#172554" rx="11"/>
  <text x="440" y="473" text-anchor="middle" fill="#60a5fa" font-family="Arial" font-size="10">journals</text>
