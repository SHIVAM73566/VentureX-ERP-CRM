<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Segoe UI, Arial, sans-serif">
  <defs><linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#0f172a"/><stop offset="100%" style="stop-color:#1e293b"/></linearGradient></defs>
  <rect width="800" height="450" fill="url(#bg)" rx="12"/>
  <rect x="0" y="0" width="800" height="56" fill="#1e40af" rx="12"/><rect x="0" y="30" width="800" height="26" fill="#1e40af"/>
  <text x="400" y="24" text-anchor="middle" fill="#93c5fd" font-size="12">VentureX ERP & CRM — Installation Guide</text>
  <text x="400" y="46" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">Step 3: Configure Database</text>
  <rect x="40" y="75" width="360" height="350" rx="8" fill="#1e293b" stroke="#334155"/>
  <rect x="40" y="75" width="360" height="30" rx="8" fill="#0f172a"/><rect x="40" y="97" width="360" height="8" fill="#0f172a"/>
  <text x="220" y="96" text-anchor="middle" fill="#94a3b8" font-size="11">📝 .env — Database Configuration</text>
  <text x="56" y="125" fill="#7ee787" font-size="12" font-family="monospace">cp .env.example .env</text>
  <text x="56" y="145" fill="#7ee787" font-size="12" font-family="monospace">php artisan key:generate</text>
  <text x="56" y="165" fill="#7ee787" font-size="12" font-family="monospace">  ✓ Application key set successfully.</text>
  <rect x="56" y="180" width="328" height="2" fill="#334155"/>
  <text x="56" y="200" fill="#8b949e" font-size="12" font-family="monospace">DB_CONNECTION=<tspan fill="#4ade80">mysql</tspan></text>
  <text x="56" y="218" fill="#8b949e" font-size="12" font-family="monospace">DB_HOST=<tspan fill="#4ade80">127.0.0.1</tspan></text>
  <text x="56" y="236" fill="#8b949e" font-size="12" font-family="monospace">DB_PORT=<tspan fill="#4ade80">3306</tspan></text>
  <text x="56" y="254" fill="#8b949e" font-size="12" font-family="monospace">DB_DATABASE=<tspan fill="#22c55e" font-weight="700">venturex_erp</tspan></text>
  <text x="56" y="272" fill="#8b949e" font-size="12" font-family="monospace">DB_USERNAME=<tspan fill="#22c55e" font-weight="700">venturex_erp_user</tspan></text>
  <text x="56" y="290" fill="#8b949e" font-size="12" font-family="monospace">DB_PASSWORD=<tspan fill="#fbbf24" font-weight="700">your_password</tspan></text>
  <rect x="56" y="305" width="328" height="2" fill="#334155"/>
  <text x="56" y="328" fill="#8b949e" font-size="12" font-family="monospace">APP_NAME=<tspan fill="#c9d1d9">"VentureX ERP & CRM"</tspan></text>
  <text x="56" y="346" fill="#8b949e" font-size="12" font-family="monospace">APP_ENV=<tspan fill="#c9d1d9">local</tspan></text>
  <text x="56" y="364" fill="#8b949e" font-size="12" font-family="monospace">APP_DEBUG=<tspan fill="#c9d1d9">true</tspan></text>
  <text x="56" y="382" fill="#8b949e" font-size="12" font-family="monospace">APP_URL=<tspan fill="#c9d1d9">http://localhost:8000</tspan></text>
  <rect x="420" y="75" width="340" height="350" rx="8" fill="#0d1117" stroke="#21262d"/>
  <rect x="420" y="75" width="340" height="30" rx="8" fill="#161b22"/><rect x="420" y="97" width="340" height="8" fill="#161b22"/>
  <circle cx="438" cy="91" r="5" fill="#ef4444"/><circle cx="454" cy="91" r="5" fill="#eab308"/><circle cx="470" cy="91" r="5" fill="#22c55e"/>
  <text x="590" y="96" text-anchor="middle" fill="#8b949e" font-size="11">MySQL Terminal — Create Database</text>
  <text x="440" y="128" fill="#7ee787" font-size="12" font-family="monospace">$ mysql -u root -p</text>
  <text x="440" y="155" fill="#79c0ff" font-size="12" font-family="monospace">mysql&gt; <tspan fill="#c9d1d9">CREATE DATABASE venturex_erp;</tspan></text>
  <text x="440" y="175" fill="#7ee787" font-size="11" font-family="monospace">Query OK, 1 row affected</text>
  <text x="440" y="205" fill="#79c0ff" font-size="12" font-family="monospace">mysql&gt; <tspan fill="#c9d1d9">CREATE USER 'venturex_erp_user'@'127.0.0.1'</tspan></text>
  <text x="456" y="225" fill="#c9d1d9" font-size="12" font-family="monospace">IDENTIFIED BY 'your_password';</text>
  <text x="440" y="245" fill="#7ee787" font-size="11" font-family="monospace">Query OK, 0 rows affected</text>
  <text x="440" y="275" fill="#79c0ff" font-size="12" font-family="monospace">mysql&gt; <tspan fill="#c9d1d9">GRANT ALL PRIVILEGES</tspan></text>
  <text x="456" y="295" fill="#c9d1d9" font-size="12" font-family="monospace">ON venturex_erp.* TO 'venturex_erp_user'@'127.0.0.1';</text>
  <text x="440" y="320" fill="#79c0ff" font-size="12" font-family="monospace">mysql&gt; <tspan fill="#c9d1d9">FLUSH PRIVILEGES;</tspan></text>
  <text x="440" y="340" fill="#7ee787" font-size="11" font-family="monospace">Query OK, 0 rows affected</text>
  <text x="440" y="365" fill="#79c0ff" font-size="12" font-family="monospace">mysql&gt; <tspan fill="#c9d1d9">EXIT;</tspan></text>
  <rect x="440" y="385" width="300" height="28" rx="4" fill="#422006" stroke="#f59e0b"/>
  <text x="590" y="404" text-anchor="middle" fill="#fbbf24" font-size="11">⚠ Replace "your_password" with a real password!</text>
</svg>
