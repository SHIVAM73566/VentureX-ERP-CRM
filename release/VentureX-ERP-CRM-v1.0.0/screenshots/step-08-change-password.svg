<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Segoe UI, Arial, sans-serif">
  <defs><linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:#0f172a"/><stop offset="100%" style="stop-color:#1e293b"/></linearGradient></defs>
  <rect width="800" height="450" fill="url(#bg)" rx="12"/>
  <rect x="0" y="0" width="800" height="56" fill="#1e40af" rx="12"/><rect x="0" y="30" width="800" height="26" fill="#1e40af"/>
  <text x="400" y="24" text-anchor="middle" fill="#93c5fd" font-size="12">VentureX ERP & CRM — Installation Guide</text>
  <text x="400" y="46" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">Step 8: Change Admin Password</text>
  <rect x="40" y="75" width="720" height="350" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <rect x="40" y="75" width="720" height="40" rx="8" fill="#422006"/>
  <text x="400" y="101" text-anchor="middle" fill="#fbbf24" font-size="16" font-weight="700">⚠ IMPORTANT: Change Your Password Now!</text>
  <text x="60" y="140" fill="#e2e8f0" font-size="14">The default password is for setup only. Change it immediately:</text>
  <rect x="60" y="155" width="680" height="50" rx="6" fill="#0f172a"/>
  <text x="80" y="177" fill="#3b82f6" font-size="14" font-weight="700">1.</text>
  <text x="100" y="177" fill="#cbd5e1" font-size="14">Click your name/avatar in the top-right corner</text>
  <rect x="60" y="215" width="680" height="50" rx="6" fill="#0f172a"/>
  <text x="80" y="237" fill="#3b82f6" font-size="14" font-weight="700">2.</text>
  <text x="100" y="237" fill="#cbd5e1" font-size="14">Select "Profile" or "Settings"</text>
  <rect x="60" y="275" width="680" height="50" rx="6" fill="#0f172a"/>
  <text x="80" y="297" fill="#3b82f6" font-size="14" font-weight="700">3.</text>
  <text x="100" y="297" fill="#cbd5e1" font-size="14">Change password to something strong (8+ characters)</text>
  <rect x="60" y="335" width="680" height="50" rx="6" fill="#0f172a"/>
  <text x="80" y="357" fill="#3b82f6" font-size="14" font-weight="700">4.</text>
  <text x="100" y="357" fill="#cbd5e1" font-size="14">Update the email to your real email address</text>
  <rect x="60" y="395" width="680" height="20" rx="4" fill="#052e16"/>
  <text x="400" y="410" text-anchor="middle" fill="#4ade80" font-size="12" font-weight="600">✓ After this, your VentureX ERP & CRM is fully installed and secure!</text>
</svg>
