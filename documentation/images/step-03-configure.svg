<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)" rx="12"/>

  <rect x="20" y="20" width="760" height="50" fill="#1e40af" rx="8"/>
  <circle cx="50" cy="45" r="16" fill="white"/>
  <text x="50" y="50" text-anchor="middle" fill="#1e40af" font-family="Arial" font-size="16" font-weight="bold">3</text>
  <text x="400" y="50" text-anchor="middle" fill="white" font-family="Arial,sans-serif" font-size="18" font-weight="bold">Step 3: Configure Database</text>

  <!-- .env editor mockup -->
  <rect x="30" y="90" width="380" height="380" fill="#1e293b" stroke="#334155" stroke-width="1" rx="8"/>
  <rect x="30" y="90" width="380" height="35" fill="#0f172a" rx="8"/>
  <rect x="30" y="115" width="380" height="10" fill="#0f172a"/>
  <text x="220" y="108" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="12">📝 .env — Database Config</text>

  <text x="50" y="145" fill="#7ee787" font-family="monospace" font-size="12">DB_CONNECTION=<tspan fill="#4ade80">mysql</tspan></text>
  <text x="50" y="165" fill="#7ee787" font-family="monospace" font-size="12">DB_HOST=<tspan fill="#4ade80">127.0.0.1</tspan></text>
  <text x="50" y="185" fill="#7ee787" font-family="monospace" font-size="12">DB_PORT=<tspan fill="#4ade80">3306</tspan></text>
  <text x="50" y="205" fill="#7ee787" font-family="monospace" font-size="12">DB_DATABASE=<tspan fill="#4ade80">venturex_erp</tspan></text>
  <text x="50" y="225" fill="#7ee787" font-family="monospace" font-size="12">DB_USERNAME=<tspan fill="#4ade80">venturex_user</tspan></text>
  <text x="50" y="245" fill="#7ee787" font-family="monospace" font-size="12">DB_PASSWORD=<tspan fill="#fbbf24">your_password</tspan></text>

  <rect x="50" y="265" width="340" height="2" fill="#334155"/>

  <text x="50" y="290" fill="#8b949e" font-family="monospace" font-size="12">APP_NAME=<tspan fill="#c9d1d9">"VentureX ERP &amp; CRM"</tspan></text>
  <text x="50" y="310" fill="#8b949e" font-family="monospace" font-size="12">APP_ENV=<tspan fill="#c9d1d9">local</tspan></text>
  <text x="50" y="330" fill="#8b949e" font-family="monospace" font-size="12">APP_DEBUG=<tspan fill="#c9d1d9">true</tspan></text>
  <text x="50" y="350" fill="#8b949e" font-family="monospace" font-size="12">APP_URL=<tspan fill="#c9d1d9">http://localhost:8000</tspan></text>

  <rect x="50" y="370" width="340" height="2" fill="#334155"/>

  <text x="50" y="395" fill="#fbbf24" font-family="monospace" font-size="11">⚠ Change DB_PASSWORD to your</text>
  <text x="50" y="415" fill="#fbbf24" font-family="monospace" font-size="11">  actual MySQL password!</text>

  <!-- MySQL terminal -->
  <rect x="430" y="90" width="340" height="380" fill="#0d1117" stroke="#21262d" stroke-width="1" rx="8"/>
  <rect x="430" y="90" width="340" height="35" fill="#161b22" rx="8"/>
  <rect x="430" y="115" width="340" height="10" fill="#161b22"/>
  <circle cx="455" cy="107" r="5" fill="#ef4444"/><circle cx="472" cy="107" r="5" fill="#eab308"/><circle cx="489" cy="107" r="5" fill="#22c55e"/>
  <text x="600" y="108" text-anchor="middle" fill="#8b949e" font-family="monospace" font-size="11">MySQL Terminal</text>

  <text x="450" y="145" fill="#7ee787" font-family="monospace" font-size="11">$ mysql -u root -p</text>
  <text x="450" y="170" fill="#79c0ff" font-family="monospace" font-size="11">mysql&gt; <tspan fill="#c9d1d9">CREATE DATABASE</tspan></text>
  <text x="465" y="190" fill="#c9d1d9" font-family="monospace" font-size="11">  venturex_erp;</text>
  <text x="450" y="210" fill="#7ee787" font-family="monospace" font-size="11">Query OK, 1 row affected</text>

  <text x="450" y="240" fill="#79c0ff" font-family="monospace" font-size="11">mysql&gt; <tspan fill="#c9d1d9">CREATE USER</tspan></text>
  <text x="465" y="260" fill="#c9d1d9" font-family="monospace" font-size="11">  'venturex_user'@'127.0.0.1'</text>
  <text x="465" y="280" fill="#c9d1d9" font-family="monospace" font-size="11">  IDENTIFIED BY 'your_password';</text>
  <text x="450" y="300" fill="#7ee787" font-family="monospace" font-size="11">Query OK, 0 rows affected</text>

  <text x="450" y="330" fill="#79c0ff" font-family="monospace" font-size="11">mysql&gt; <tspan fill="#c9d1d9">GRANT ALL PRIVILEGES</tspan></text>
  <text x="465" y="350" fill="#c9d1d9" font-family="monospace" font-size="11">  ON venturex_erp.*</text>
  <text x="465" y="370" fill="#c9d1d9" font-family="monospace" font-size="11">  TO 'venturex_user'@'127.0.0.1';</text>

  <text x="450" y="400" fill="#79c0ff" font-family="monospace" font-size="11">mysql&gt; <tspan fill="#c9d1d9">FLUSH PRIVILEGES;</tspan></text>
  <text x="450" y="420" fill="#7ee787" font-family="monospace" font-size="11">Query OK, 0 rows affected</text>

  <text x="450" y="445" fill="#79c0ff" font-family="monospace" font-size="11">mysql&gt; <tspan fill="#c9d1d9">EXIT;</tspan></text>
</svg>
